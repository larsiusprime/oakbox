name: bundles

# Checks, then build the portable Windows and Linux bundles on Linux and prove each
# runs on a clean machine of its platform using only the bundled Python (oakbox/smoke.py:
# OpenAVMKit's own stages on Petersburg's public data, then the app service, a project and a file).
on:
  push:
    branches: [claude/openavmkit-desktop-wrapper-639lvu, main]
    # A version tag (v0.1.0, matching pyproject.toml's version) also publishes a GitHub Release.
    tags: ["v*"]
  # Every pull request runs all of it, bundles included: a change to the dependencies can break a bundle.
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request stops its run still going (each bundle is ~550 MB of artifacts); a run for a
# push to a branch or a tag always finishes.
concurrency:
  group: bundles-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python dependencies
        # The engine is a git dependency on OpenAVMKit's public repo, pinned by commit (pyproject.toml).
        run: uv sync
      - name: Python lint, format, types, tests
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pyright
          uv run pytest -q tests
      - name: Tests with a non-UTF-8 default encoding (as on Windows)
        # Windows reads and writes text in its code page (cp1252) unless told otherwise. Plain ASCII is stricter,
        # so anything that leans on the default encoding fails here first (AGENTS.md, "Windows").
        env:
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
          LC_ALL: C
          LANG: C
        run: uv run python -c "import locale; assert locale.getpreferredencoding(False).lower() != 'utf-8'" && uv run pytest -q tests
      - name: Web lint, types, tests
        working-directory: web
        run: |
          npm ci
          npm run -s wording:types -- --check
          npx biome check src
          npx eslint src
          npx tsc --noEmit
          npm test
      - name: Generated API types are up to date
        run: |
          uv run python -c "import json; from oakbox.app import create_app; print(json.dumps(create_app().openapi(), indent=1))" > web/openapi.json
          (cd web && npm run -s api)
          git diff --exit-code web/openapi.json web/src/api/schema.d.ts

  # The real window and its Win32 menu bar, from source, so it doesn't wait on the bundle.
  menus-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python dependencies
        run: uv sync
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Native menus (opens the real window, checks and clicks its Win32 menu bar)
        timeout-minutes: 5
        run: uv run python -m oakbox --selftest-menus
      # Ending a run's process tree is different code on Windows (no process groups): Stop, the app closing, and the
      # app killed outright each leave no process behind (the checks job runs these on Linux).
      - name: Runs end with Stop and with the app, workers included (Windows)
        timeout-minutes: 5
        run: uv run pytest -q tests/test_runs_end.py

  # The same on Linux: the Qt window and its menu bar, under a virtual display.
  menus-linux:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Display libraries Qt needs (a desktop has them already)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 libasound2t64
      - name: Python dependencies
        run: uv sync
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Native menus (opens the real window, checks and clicks its Qt menu bar)
        timeout-minutes: 5
        run: xvfb-run -a uv run python -m oakbox --selftest-menus

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # to delete older bundle artifacts before uploading this one
    strategy:
      matrix:
        platform: [windows, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: packaging/build_bundle.sh ${{ matrix.platform }}
      - name: Delete older bundle artifacts (the storage quota fits only a few)
        uses: actions/github-script@v7
        with:
          script: |
            const name = "bundle-${{ matrix.platform }}";
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100,
            });
            const hourAgo = Date.now() - 60 * 60 * 1000;
            for (const a of artifacts) {
              // Leave this run's and any other run's from the last hour, which may still be in use.
              if (a.expired || a.workflow_run?.id === context.runId || Date.parse(a.created_at) > hourAgo) continue;
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id,
              });
              core.info(`Deleted ${a.name} from run ${a.workflow_run?.id}`);
            }
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 1  # each Windows bundle is ~550 MB; the artifact quota is shared

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle-windows
      - name: Unpack
        shell: pwsh
        run: Expand-Archive oakbox-win64.zip -DestinationPath C:\oak
      - name: Smoke test (bundled Python only)
        shell: cmd
        run: |
          set PATH=C:\Windows\system32;C:\Windows
          C:\oak\oakbox-win64\smoke.cmd

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle-linux
      - name: Unpack
        run: mkdir -p /tmp/oak && tar -xzf oakbox-linux-x86_64.tar.gz -C /tmp/oak
      - name: Smoke test (bundled Python only, empty environment)
        run: env -i HOME=/tmp/oak PATH=/usr/bin:/bin /tmp/oak/oakbox-linux-x86_64/smoke.sh
      # XGBoost and CatBoost aren't in the bundle: OAK box downloads them when asked (oakbox/engines.py).
      - name: Optional engines download, then models train from the bundle
        run: |
          PY=/tmp/oak/oakbox-linux-x86_64/python/bin/python3
          $PY -c "import importlib.util as u; assert not u.find_spec('xgboost') and not u.find_spec('catboost')"
          $PY -m oakbox.engines install xgboost catboost
          $PY -m oakbox.engines list
          $PY -c "
          from oakbox import engines; engines.activate()
          import numpy as np, xgboost, lightgbm, catboost
          X, y = np.random.rand(500, 4), np.random.rand(500)
          xgboost.XGBRegressor(n_estimators=10).fit(X, y)
          lightgbm.LGBMRegressor(n_estimators=10, verbose=-1).fit(X, y)
          catboost.CatBoostRegressor(iterations=10, verbose=0, allow_writing_files=False).fit(X, y)
          print('xgboost, lightgbm, catboost train')"
      # The bundle's Qt is pruned (packaging/prune_qt.py): check the window and menus still work from it.
      - name: Display libraries Qt needs (a desktop has them already)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 libasound2t64
      - name: Native menus from the bundle
        timeout-minutes: 5
        run: xvfb-run -a /tmp/oak/oakbox-linux-x86_64/python/bin/python3 -m oakbox --selftest-menus

  # The Windows installer (packaging/oakbox.iss) from this bundle, then installed on a clean machine for this
  # user (no admin), started, and uninstalled again.
  installer-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle-windows
          path: dist
      - name: Unpack the bundle
        shell: pwsh
        run: Expand-Archive dist\oakbox-win64.zip -DestinationPath dist
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -ne "tag") { $version = "$version-dev.${{ github.run_number }}" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          # The optional engines' sizes, for the installer's components page.
          $e = (Get-Content dist\oakbox-win64\python\Lib\site-packages\oakbox\engines.json | ConvertFrom-Json).engines
          $sizes = foreach ($k in 'xgboost', 'catboost') {
            $dl = ($e.$k.wheels | Measure-Object size -Sum).Sum
            "/D$($k)Download=$([math]::Round($dl / 1e6))", "/D$($k)Disk=$($e.$k.disk)"
          }
          & $iscc /Q "/DAppVersion=$version" @sizes packaging\oakbox.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\*-setup.exe | Format-Table Name, Length
      - name: Install for this user, start it, uninstall it
        shell: pwsh
        timeout-minutes: 20
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe)[0].FullName
          # With the XGBoost component ticked: the installer downloads it (CatBoost stays out).
          Start-Process $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/COMPONENTS=xgboost', '/LOG=install.log'
          $dir = "$env:LOCALAPPDATA\Programs\OAK box"
          if (-not (Test-Path "$dir\python\pythonw.exe")) { Get-Content install.log -Tail 30; throw "not installed in $dir" }
          $engines = "$env:LOCALAPPDATA\OAK box\engines"
          & "$dir\python\python.exe" -X utf8 -m oakbox.engines list
          if (-not (Test-Path "$engines\xgboost\engine.json")) { Get-Content install.log -Tail 30; throw "XGBoost wasn't downloaded" }
          if (Test-Path "$engines\catboost") { throw "CatBoost was downloaded without being ticked" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\OAK box\OAK box.lnk")) { throw "no Start menu entry" }
          # The app service from the installed copy answers, with the installer's version.
          $env:OAKBOX_HOME = "$env:RUNNER_TEMP\oakhome"
          $p = Start-Process "$dir\python\python.exe" -PassThru -ArgumentList '-X', 'utf8', '-m', 'oakbox', '--no-window', '--port', '8799'
          $v = $null
          foreach ($i in 1..90) { try { $v = Invoke-RestMethod http://127.0.0.1:8799/api/version; break } catch { Start-Sleep 1 } }
          Stop-Process -Id $p.Id -Force
          if (-not $v) { throw "the installed app didn't start" }
          "OAK box $($v.version), OpenAVMKit $($v.openavmkit)"
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          Start-Sleep 3
          if (Test-Path "$dir\python") { throw "uninstall left $dir\python" }
          if (Test-Path $engines) { throw "uninstall left $engines" }
          "installed, started, uninstalled"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*-setup.exe
          retention-days: 1

  # A version tag publishes a GitHub Release (a pre-release while OAK box is early): the installer and the
  # portable zip. The tag must be pyproject.toml's version.
  release:
    if: github.ref_type == 'tag'
    needs: [installer-windows, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} isn't pyproject.toml's version (v$version)"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: bundle-windows
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release/oakbox-win64.zip "release/OAKbox-${GITHUB_REF_NAME#v}-win64-portable.zip"
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "OAK box ${GITHUB_REF_NAME#v}" --prerelease --generate-notes \
            --notes-file packaging/RELEASE_NOTES.md
