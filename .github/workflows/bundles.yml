name: bundles

# Checks, then build the portable Windows and Linux bundles on Linux and prove each
# runs on a clean machine of its platform using only the bundled Python: download
# the sample county and run steps 1-4 through the real app service.
on:
  push:
    branches: [claude/openavmkit-desktop-wrapper-639lvu, main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: openavmkit-oakbox
          path: build/engine
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python dependencies
        # The engine is a git dependency on this private repo; point uv at the checked-out copy.
        run: |
          git config --global url."$(pwd)/build/engine".insteadOf https://github.com/larsiusprime/oakbox
          uv sync
      - name: Python lint, format, types, tests
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pyright
          uv run pytest -q tests
      - name: Web lint, types
        working-directory: web
        run: |
          npm ci
          npx biome check src
          npx eslint src
          npx tsc --noEmit
      - name: Generated API types are up to date
        run: |
          uv run python -c "import json; from oakbox.app import create_app; print(json.dumps(create_app().openapi(), indent=1))" > web/openapi.json
          (cd web && npm run -s api)
          git diff --exit-code web/openapi.json web/src/api/schema.d.ts

  # The real window and its Win32 menu bar, from source, so it doesn't wait on the bundle.
  menus-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: openavmkit-oakbox
          path: build/engine
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python dependencies
        shell: pwsh
        run: |
          $engine = (Join-Path (Get-Location) "build/engine") -replace '\\', '/'
          git config --global url."$engine".insteadOf https://github.com/larsiusprime/oakbox
          uv sync
      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Native menus (opens the real window, checks and clicks its Win32 menu bar)
        timeout-minutes: 5
        run: uv run python -m oakbox --selftest-menus

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows, linux]
    steps:
      - uses: actions/checkout@v4
      # The engine branch lives in this (private) repo; check it out with the job token.
      - uses: actions/checkout@v4
        with:
          ref: openavmkit-oakbox
          path: build/engine
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: packaging/build_bundle.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 1  # each Windows bundle is ~550 MB; the artifact quota is shared

  smoke-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle-windows
      - name: Unpack
        shell: pwsh
        run: Expand-Archive oakbox-win64.zip -DestinationPath C:\oak
      - name: Smoke test (bundled Python only)
        shell: cmd
        run: |
          set PATH=C:\Windows\system32;C:\Windows
          C:\oak\oakbox-win64\smoke.cmd

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle-linux
      - name: Unpack
        run: mkdir -p /tmp/oak && tar -xzf oakbox-linux-x86_64.tar.gz -C /tmp/oak
      - name: Smoke test (bundled Python only, empty environment)
        run: env -i HOME=/tmp/oak PATH=/usr/bin:/bin /tmp/oak/oakbox-linux-x86_64/smoke.sh
