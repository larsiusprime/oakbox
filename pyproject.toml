[project]
name = "oakbox"
version = "0.0.1"
description = "OpenAVMKit in a box: a desktop app for assessors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openavmkit",
    "psutil>=6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pywebview>=5.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "pyright>=1.1.390"]

[tool.uv.sources]
openavmkit = { git = "https://github.com/larsiusprime/oakbox", rev = "b0ec47658c806a6eb870a89ab1f02d053b5ace6e" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oakbox"]
