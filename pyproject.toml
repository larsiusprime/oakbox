[project]
name = "oakbox"
version = "0.0.1"
description = "OpenAVMKit in a box: a desktop app for assessors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openavmkit",
    "psutil>=6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # The native menus use pywebview's window internals (oakbox/winmenu.py, qtmenu.py): keep to one series.
    "pywebview>=6.2.1,<6.3",
    # Linux: Qt for the native window and its menus (SPEC §3.14); Windows uses WebView2.
    "PySide6>=6.12; sys_platform == 'linux'",  # needs glibc 2.34+ (Ubuntu 22.04, Debian 12)
    "QtPy>=2.4; sys_platform == 'linux'",
    "send2trash>=2.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "pyright>=1.1.390"]

[tool.uv.sources]
openavmkit = { git = "https://github.com/larsiusprime/oakbox", rev = "f5680d4de8f9d79457d2f5cbd08f75ab037300f6" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oakbox"]
# The built UI is git-ignored but must ship in the wheel.
artifacts = ["src/oakbox/web/**"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
