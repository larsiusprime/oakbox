[project]
name = "oakbox"
version = "0.0.1"
description = "OpenAVMKit in a box: a desktop app for assessors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openavmkit",
    "psutil>=6",
]

[tool.uv.sources]
openavmkit = { git = "https://github.com/larsiusprime/oakbox", rev = "f35b08989efd35b234409e6a60b0df3ae66a6c96" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oakbox"]
