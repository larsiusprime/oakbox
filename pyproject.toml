[project]
name = "oakbox"
version = "0.0.1"
description = "OpenAVMKit in a box: a desktop app for assessors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "openavmkit",
    "psutil>=6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pywebview>=5.3",
    "send2trash>=2.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "pyright>=1.1.390"]

[tool.uv.sources]
openavmkit = { git = "https://github.com/larsiusprime/oakbox", rev = "1041689349244634c99e1159b00d0207cf286992" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oakbox"]
# The built UI is git-ignored but must ship in the wheel.
artifacts = ["src/oakbox/web/**"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
